CONFIG_MAIN_STACK_SIZE=8192
CONFIG_LOG=y
# Logs arrive in bursts (self-test, ASCII 28x28 image + 1568-character IMG
# line): larger buffer so none are lost
CONFIG_LOG_BUFFER_SIZE=8192

# Embedded AI: TensorFlow Lite Micro (C++) + CMSIS-NN optimized kernels
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y

# Display and touch
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y
CONFIG_INPUT=y
# By default, the input thread has the same (lowest) priority as the log
# thread. While a debug image was being sent (~0.3 s over the UART), it no
# longer ran and touch points were lost ("Event dropped, queue full").
# Priority higher than the log, lower than main (0).
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=5

# LVGL (the pointer is created automatically from the DTS "zephyr,touch")
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_USE_LOG=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_IMAGE=y
# The drawing canvas is 8-bit grayscale (L8)
CONFIG_LV_DRAW_SW_SUPPORT_L8=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_24=y
# Recognized digit in large font
CONFIG_LV_FONT_MONTSERRAT_48=y
CONFIG_LV_USE_BAR=y
